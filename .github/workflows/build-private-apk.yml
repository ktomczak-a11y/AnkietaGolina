name: Build private APK

on:
  workflow_dispatch:
  push:
    branches: [publish-pwa]
    paths:
      - 'android/**'
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - 'beneficiaries.css'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'nasz-prad-logo.png'
      - '.github/workflows/build-private-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Refresh embedded application
        run: |
          cp app.js beneficiaries.css icon.svg index.html manifest.webmanifest nasz-prad-logo.png styles.css sw.js android/app/src/main/assets/
      - name: Build installable APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare private APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AnkietaGolina-private.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AnkietaGolina-private-apk
          path: AnkietaGolina-private.apk
          retention-days: 30
          if-no-files-found: error
